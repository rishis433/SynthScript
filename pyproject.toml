[project]
name = "synthscript"
version = "0.1.0"
description = "AI automation framework for UI flow discovery and replay"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "openai>=1.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "flask>=3.0.0",
]

[project.scripts]
synthscript = "synthscript.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
